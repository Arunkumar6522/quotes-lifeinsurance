  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow-y: auto; background: #fff;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    body::-webkit-scrollbar { display: none; }
    /* Hide LeadBot's own form header inside the iframe */
    .leadforms-header,
    .leadforms-form-header,
    [class*="leadforms-header"],
    [class*="lf-header"],
    [class*="form-header"] { display: none !important; }
    #leadforms-embd-form { width: 100%; min-height: 100%; }
  </style>
</head>
<body>
  <div id="leadforms-embd-form"></div>
  <script type="text/javascript">
    // Always show top of form on load
    window.addEventListener('load', function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });
    try { history.replaceState(null, '', '/'); } catch(e) {}
    window.form_token = "GLFT-SLXXIK16MWTFAIC7BTF8VQAQO5O";
  </script>
  <script async type="text/javascript" src="https://api.useleadbot.com/lead-bots/get-pixel-script.js"></script>
