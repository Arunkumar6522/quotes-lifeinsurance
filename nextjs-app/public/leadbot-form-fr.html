<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obtenez un devis gratuit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden; background: #fff;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    body::-webkit-scrollbar { display: none; }
    /* Hide LeadBot's own form header inside the iframe */
    .leadforms-header,
    .leadforms-form-header,
    [class*="leadforms-header"],
    [class*="lf-header"],
    [class*="form-header"] { display: none !important; }
    #leadforms-embd-form { width: 100%; min-height: 100%; }
    /* Fallback font override — prevents CORS request for AvenirLTStdBlack */
    @font-face {
      font-family: 'AvenirLTStdBlack';
      src: local('Trebuchet MS'), local('Arial Black'), local('Arial');
      font-weight: 900;
      font-style: normal;
    }
  </style>
  <script>
    (function() {
      const patchStyles = () => {
        document.querySelectorAll('style').forEach(function(el) {
          if (el.dataset.patched) return;
          if (el.textContent.includes('useleadbot.com/fonts')) {
            el.textContent = el.textContent.replace(
              /url\s*\(\s*['"]?https?:\/\/media\.useleadbot\.com\/fonts\/[^)'"]+['"]?\s*\)/gi,
              "local('Arial Black')"
            );
            el.dataset.patched = '1';
          }
        });
      };
      const observer = new MutationObserver(patchStyles);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      if (document.readyState !== 'loading') patchStyles();
      else document.addEventListener('DOMContentLoaded', patchStyles);
    })();
  </script>
</head>
<body>
  <div id="leadforms-embd-form"></div>
  <script type="text/javascript">
    // Always scroll to top so the heading is visible first
    window.addEventListener('load', function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });
    try { history.replaceState(null, '', '/'); } catch(e) {}
    window.form_token = "GLFT-3XAH9YY98KG1NPVKWXCSSJU5S38";

    window.addEventListener('pagehide', function() {
      try {
        window.parent.sessionStorage.setItem('form_submitted', '1');
      } catch(e) {
        try { window.parent.postMessage({ type: 'FORM_SUBMITTED' }, '*'); } catch(e2) {}
      }
    });
  </script>
  <script async type="text/javascript" src="https://api.useleadbot.com/lead-bots/get-pixel-script.js"></script>
</body>
</html>
